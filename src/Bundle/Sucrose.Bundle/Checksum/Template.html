    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --danger-color: #ef4444;
            --danger-dark: #dc2626;
            --success-color: #10b981;
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(99, 102, 241, 0.4);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            position: relative;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .error-icon svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .error-code {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-family: 'Courier New', monospace;
        }

        .description {
            text-align: center;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 16px;
        }

        .download-section {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
        }

        .download-title {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .download-buttons {
            display: grid;
            gap: 12px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 24px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .download-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.25);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
        }

        .lang-switch {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: var(--text-primary);
        }

        .lang-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .lang-switch {
                top: 16px;
                right: 16px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

    <script>
        // Language translations
        const translations = {
            en: {
                'title': 'Installation Error',
                'description': 'The installation files are corrupted or incomplete. One or more files failed the integrity check. Please try reinstalling the application from an official source.',
                'download-title': 'Download from Official Sources',
                'official-website': 'Official Website'
            },
            tr: {
                'title': 'Kurulum Hatası',
                'description': 'Kurulum dosyaları bozuk veya eksik. Bir veya daha fazla dosya bütünlük kontrolünden geçemedi. Lütfen uygulamayı resmi bir kaynaktan yeniden yüklemeyi deneyin.',
                'download-title': 'Resmi Kaynaklardan İndir',
                'official-website': 'Resmi Web Sitesi'
            }
        };

        let currentLang = 'en';

        // Set language
        function setLanguage(lang, buttonElement) {
            currentLang = lang;
            
            // Update active language button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick').includes(lang)) {
                    btn.classList.add('active');
                }
            });
            
            // If button element is provided, add active class to it
            if (buttonElement) {
                buttonElement.classList.add('active');
            }
            
            // Update text content
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                if (translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
            
            // Update HTML lang attribute
            document.documentElement.lang = lang;
            
            // Update page title
            document.title = `Sucrose - ${translations[lang]['title']}`;
        }

        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize particles on page load
        createParticles();

        // Detect browser language and set initial language
        window.addEventListener('DOMContentLoaded', () => {
            const browserLang = navigator.language || navigator.userLanguage;
            
            // Check if browser language matches any of our supported languages
            const supportedLangs = Object.keys(translations);
            let detectedLang = 'en'; // Default to English
            
            // Check for exact match or language prefix match
            for (const lang of supportedLangs) {
                if (browserLang.toLowerCase().startsWith(lang)) {
                    detectedLang = lang;
                    break;
                }
            }
            
            // Set the detected language
            setLanguage(detectedLang);
        });
    </script>
