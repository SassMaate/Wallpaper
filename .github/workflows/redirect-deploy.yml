name: Deploy redirect to sucrose.dev

# The Nuxt marketing site has been retired — the official site is now
# https://sucrose.dev, and `.pages` now contains ONLY a static client-side
# redirect stub (index.html + 404.html). This workflow NO LONGER builds Nuxt;
# it just deploys `.pages` so https://taiizor.github.io/Sucrose/* forwards to
# https://sucrose.dev/* (GitHub Pages cannot issue a server-side 301 to an
# external host, so the stub uses meta-refresh + canonical + path-preserving JS).
#
# See Hub/docs/runbook-retire-nuxt.md. PRECONDITION before this is allowed to
# run live: https://sucrose.dev must be live and verified, otherwise visitors
# would be redirected to a dead host.

on:
  # Redeploy the stub only when the stub or this workflow changes.
  push:
    branches: ["develop"]
    paths:
      - ".pages/**"
      - ".github/workflows/redirect-deploy.yml"

  # Can also be run manually from the Actions tab
  workflow_dispatch:

# Permissions for GITHUB_TOKEN
permissions:
  pages: write
  contents: read
  id-token: write

# Ensures only one deployment happens at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-redirect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Redirect Stub
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5