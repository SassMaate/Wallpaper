name: Deploy Nuxt to GitHub Pages

on:
  # Runs when changes are pushed to main or develop branch
  push:
    branches: ["develop"]
  
  # Can also be run manually from the Actions tab
  workflow_dispatch:

# Permissions for GITHUB_TOKEN
permissions:
  pages: write
  contents: read
  id-token: write

# Ensures only one deployment happens at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
        
      - name: Install Dependencies
        working-directory: .pages
        run: bun install
      
      - name: Build Static Site
        working-directory: .pages
        run: bun run generate
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.pages/.output/public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 